<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Inventario - Velas y Volcanes</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        h1, h2 {
            color: #2c3e50;
            text-align: center;
        }
        .section {
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eaeaea;
        }
        .form-row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .form-group {
            flex: 1;
            min-width: 200px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
            box-sizing: border-box;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #2980b9;
        }
        .btn-danger {
            background-color: #e74c3c;
        }
        .btn-danger:hover {
            background-color: #c0392b;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
        }
        th {
            background-color: #f8f9fa;
            color: #333;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .stock-bajo {
            color: #e74c3c;
            font-weight: bold;
        }
        .stock-ok {
            color: #27ae60;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Control de Inventario</h1>
    <p style="text-align: center; color: #666;">Gestiona tus compras, salidas y stock en la nube en tiempo real.</p>

    <!-- Sección 1: Agregar nuevo producto -->
    <div class="section">
        <h2>1. Agregar Nuevo Artículo</h2>
        <form id="productForm">
            <div class="form-row">
                <div class="form-group">
                    <label for="nombre">Nombre del Artículo:</label>
                    <input type="text" id="nombre" placeholder="Ej. Vela Aromática / Volcán 3m" required>
                </div>
                <div class="form-group">
                    <label for="categoria">Categoría:</label>
                    <select id="categoria">
                        <option value="Vela">Vela</option>
                        <option value="Volcán">Volcán</option>
                        <option value="Otro">Otro</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="cantidadInicial">Cantidad Inicial:</label>
                    <input type="number" id="cantidadInicial" min="0" value="0" required>
                </div>
            </div>
            <button type="submit">Guardar Artículo</button>
        </form>
    </div>

    <!-- Sección 2: Registrar Compra o Salida -->
    <div class="section">
        <h2>2. Registrar Compras o Salidas</h2>
        <form id="transactionForm">
            <div class="form-row">
                <div class="form-group">
                    <label for="selectProducto">Seleccionar Artículo:</label>
                    <select id="selectProducto" required></select>
                </div>
                <div class="form-group">
                    <label for="tipoMovimiento">Tipo de Movimiento:</label>
                    <select id="tipoMovimiento">
                        <option value="compra">Compra (Entrada)</option>
                        <option value="salida">Salida (Uso/Venta)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="cantidadMovimiento">Cantidad:</label>
                    <input type="number" id="cantidadMovimiento" min="1" value="1" required>
                </div>
            </div>
            <button type="submit">Actualizar Stock</button>
        </form>
    </div>

    <!-- Sección 3: Visualización del Inventario -->
    <div class="section">
        <h2>3. Inventario Actual a un Vistazo</h2>
        <table>
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Categoría</th>
                    <th>Stock Actual</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="inventoryTableBody">
                <tr><td colspan="5" style="color: #888;">Cargando inventario desde la nube...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Lógica de la aplicación con Firebase (Módulo JS) -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // TODO: Reemplaza estos datos con la configuración de tu proyecto en Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyDMrtXsUxpbIsXcMgnrCptIDifeCAv5chI",
        authDomain: "inventory-6e4f9.firebaseapp.com",
        projectId: "inventory-6e4f9",
        storageBucket: "inventory-6e4f9.firebasestorage.app",
        messagingSenderId: "613002986000",
        appId: "1:613002986000:web:252061f8fab3e4b343c095"
    };

    // Inicializar Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Variable global para almacenar los productos y sus IDs de Firebase
    let inventario = [];

    // Elementos del DOM
    const productForm = document.getElementById('productForm');
    const transactionForm = document.getElementById('transactionForm');
    const inventoryTableBody = document.getElementById('inventoryTableBody');
    const selectProducto = document.getElementById('selectProducto');

    // Función para renderizar la tabla y los selectores en base al arreglo sincronizado
    function actualizarInterfaz() {
        inventoryTableBody.innerHTML = '';
        selectProducto.innerHTML = '';

        if (inventario.length === 0) {
            inventoryTableBody.innerHTML = `<tr><td colspan="5" style="color: #888;">No hay artículos registrados todavía.</td></tr>`;
            selectProducto.innerHTML = `<option value="">-- No hay productos --</option>`;
            return;
        }

        inventario.forEach((item) => {
            const estadoTexto = item.stock <= 5 ? '<span class="stock-bajo">Stock Bajo</span>' : '<span class="stock-ok">Óptimo</span>';
            
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${item.nombre}</td>
                <td>${item.categoria}</td>
                <td><strong>${item.stock}</strong></td>
                <td>${estadoTexto}</td>
                <td><button class="btn-danger" onclick="window.eliminarProducto('${item.id}')">Eliminar</button></td>
            `;
            inventoryTableBody.appendChild(row);

            const option = document.createElement('option');
            option.value = item.id;
            option.textContent = `${item.nombre} (Actual: ${item.stock})`;
            selectProducto.appendChild(option);
        });
    }

    // Sincronización en tiempo real con Firestore
    onSnapshot(collection(db, "inventario"), (snapshot) => {
        inventario = [];
        snapshot.forEach((docSnap) => {
            inventario.push({
                id: docSnap.id,
                ...docSnap.data()
            });
        });
        actualizarInterfaz();
    });

    // Evento para agregar un nuevo producto a Firestore
    productForm.addEventListener('submit', async function(e) {
        e.preventDefault();
        const nombre = document.getElementById('nombre').value.trim();
        const categoria = document.getElementById('categoria').value;
        const cantidadInicial = parseInt(document.getElementById('cantidadInicial').value);

        // Validar duplicados localmente con los datos actuales
        const existe = inventario.some(item => item.nombre.toLowerCase() === nombre.toLowerCase());
        if (existe) {
            alert('Ya existe un artículo con ese nombre.');
            return;
        }

        try {
            await addDoc(collection(db, "inventario"), {
                nombre: nombre,
                categoria: categoria,
                stock: cantidadInicial
            });
            productForm.reset();
        } catch (error) {
            console.error("Error al agregar producto: ", error);
            alert("Hubo un error al guardar el artículo en la nube.");
        }
    });

    // Evento para registrar compras o salidas actualizando Firestore
    transactionForm.addEventListener('submit', async function(e) {
        e.preventDefault();
        const idSeleccionado = selectProducto.value;
        const tipo = document.getElementById('tipoMovimiento').value;
        const cantidad = parseInt(document.getElementById('cantidadMovimiento').value);

        const itemActual = inventario.find(item => item.id === idSeleccionado);
        if (!itemActual) {
            alert('Por favor selecciona un artículo válido.');
            return;
        }

        let nuevoStock = itemActual.stock;
        if (tipo === 'compra') {
            nuevoStock += cantidad;
        } else if (tipo === 'salida') {
            if (itemActual.stock < cantidad) {
                alert('No hay suficiente stock disponible para realizar esta salida.');
                return;
            }
            nuevoStock -= cantidad;
        }

        try {
            const productRef = doc(db, "inventario", idSeleccionado);
            await updateDoc(productRef, { stock: nuevoStock });
            document.getElementById('cantidadMovimiento').value = 1;
        } catch (error) {
            console.error("Error al actualizar stock: ", error);
            alert("Hubo un error al actualizar el stock.");
        }
    });

    // Función global para eliminar un producto de Firestore
    window.eliminarProducto = async function(id) {
        const item = inventario.find(i => i.id === id);
        if (confirm(`¿Estás seguro de que deseas eliminar "${item ? item.nombre : 'este producto'}"?`)) {
            try {
                await deleteDoc(doc(db, "inventario", id));
            } catch (error) {
                console.error("Error al eliminar: ", error);
                alert("Hubo un error al eliminar el producto.");
            }
        }
    };
</script>

</body>
</html>
